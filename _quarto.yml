project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"
    - "housing-predict/downloads/*.md"
  resources:
    - analytics/posthog.js
    - analytics/behavior.js
    - housing-predict/**

website:
  title: "Kenneth Low"
  site-url: https://kennethlow.com
  description: "Kenneth Low’s data science portfolio: climate, migration, and machine learning."
  page-footer:
    left: "Kenneth Low"
    right:
      - text: Privacy
        href: privacy.qmd
      - text: GitHub
        href: https://github.com/Kaxlow

  navbar:
    left:
      - href: projects/index.qmd
        text: Projects
      - href: about.qmd
        text: About
      - href: resume.qmd
        text: Resume

    right:
      - icon: github
        href: https://github.com/kaxlow
        aria-label: Kenneth Low on GitHub

format:
  html:
    theme: cosmo
    css: portfolio.css
    toc: true
    include-in-header: analytics/head.html

filters:
  - analytics/include-behavior.lua
